name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: |
          if [ -d tests ] && find tests -type f \( -name '*.test.*' -o -name '*.spec.*' \) | grep -q .; then
            bun test
          else
            echo "No test files present; skipping."
          fi

      - name: Compute CalVer alpha version
        id: calver
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y.%m.%d)"
          COUNT="$(git tag -l "v${DATE}.*" | wc -l | tr -d ' ')"
          NEXT=$((COUNT + 1))
          echo "version=${DATE}.${NEXT}-alpha" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.calver.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
